<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TeleLoad — Téléchargeur Telegram</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #11111a;
      --border: #1e1e2e;
      --accent: #00e5ff;
      --accent2: #7b61ff;
      --text: #e8e8f0;
      --muted: #5a5a72;
      --success: #00ffa3;
      --error: #ff4d6d;
      --glow: 0 0 30px rgba(0,229,255,0.15);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glowing orbs */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0,229,255,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: pulse 6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.5; transform: translateX(-50%) scale(1); }
      to   { opacity: 1;   transform: translateX(-50%) scale(1.2); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 640px;
      animation: fadeUp 0.8s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 3rem;
    }

    .logo-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border: 2px solid var(--accent);
      border-radius: 16px;
      margin-bottom: 1rem;
      position: relative;
      box-shadow: var(--glow), inset 0 0 20px rgba(0,229,255,0.05);
      animation: borderPulse 3s ease-in-out infinite;
    }

    @keyframes borderPulse {
      0%, 100% { border-color: var(--accent); box-shadow: var(--glow), inset 0 0 20px rgba(0,229,255,0.05); }
      50%       { border-color: var(--accent2); box-shadow: 0 0 30px rgba(123,97,255,0.2), inset 0 0 20px rgba(123,97,255,0.05); }
    }

    .logo-icon svg { width: 30px; height: 30px; }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .tagline {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5;
    }

    .input-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 0.75rem;
      display: block;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    input[type="url"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="url"]::placeholder { color: var(--muted); }

    input[type="url"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,229,255,0.08);
    }

    .btn {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 0.85rem 1.5rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }

    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn .btn-text { position: relative; z-index: 1; }

    /* Quality selector */
    .quality-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .quality-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.4rem 0.9rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quality-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,229,255,0.06);
    }

    /* Status area */
    #status {
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      padding: 1rem;
      font-size: 0.85rem;
      transition: all 0.3s;
    }

    #status.idle { color: var(--muted); border: 1px dashed var(--border); }
    #status.loading {
      color: var(--accent);
      border: 1px solid rgba(0,229,255,0.2);
      background: rgba(0,229,255,0.04);
    }
    #status.success {
      color: var(--success);
      border: 1px solid rgba(0,255,163,0.2);
      background: rgba(0,255,163,0.04);
      flex-direction: column;
      gap: 1rem;
    }
    #status.error {
      color: var(--error);
      border: 1px solid rgba(255,77,109,0.2);
      background: rgba(255,77,109,0.04);
    }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(0,229,255,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--success);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1.5rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.1s;
    }

    .download-btn:hover { opacity: 0.9; transform: translateY(-1px); }

    /* Info badges */
    .info-badges {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 0.35rem 0.85rem;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .badge span { color: var(--accent); font-size: 0.65rem; }

    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.8;
    }

    .footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--accent)">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </div>
    <h1>TeleLoad</h1>
    <p class="tagline">Téléchargeur de vidéos Telegram</p>
  </div>

  <div class="card">
    <label class="input-label">Lien de la vidéo Telegram</label>
    <div class="input-row">
      <input type="url" id="urlInput"
        placeholder="https://t.me/channel/123 ou https://t.me/c/..."
        autocomplete="off" spellcheck="false"/>
      <button class="btn" id="fetchBtn" onclick="handleFetch()">
        <span class="btn-text">Analyser</span>
      </button>
    </div>

    <label class="input-label">Qualité</label>
    <div class="quality-row" id="qualityRow">
      <button class="quality-btn active" data-q="best">Meilleure</button>
      <button class="quality-btn" data-q="1080">1080p</button>
      <button class="quality-btn" data-q="720">720p</button>
      <button class="quality-btn" data-q="480">480p</button>
      <button class="quality-btn" data-q="audio">Audio seul</button>
    </div>

    <div id="status" class="idle">
      Collez un lien Telegram pour commencer
    </div>

    <div class="info-badges">
      <div class="badge"><span>●</span> Vidéos publiques</div>
      <div class="badge"><span>●</span> MP4 / MP3</div>
      <div class="badge"><span>●</span> Jusqu'à 2GB</div>
    </div>
  </div>

  <div class="footer">
    Alimenté par <a href="https://github.com/yt-dlp/yt-dlp" target="_blank">yt-dlp</a> · Usage personnel uniquement<br/>
    Respectez les droits d'auteur et les CGU de Telegram
  </div>
</div>

<script>
  // Quality selector
  document.querySelectorAll('.quality-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  function getQuality() {
    return document.querySelector('.quality-btn.active')?.dataset.q || 'best';
  }

  function setStatus(type, html) {
    const el = document.getElementById('status');
    el.className = type;
    el.innerHTML = html;
  }

  async function handleFetch() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) {
      setStatus('error', '⚠️ Veuillez entrer un lien Telegram');
      return;
    }
    if (!url.includes('t.me')) {
      setStatus('error', '⚠️ Le lien doit provenir de t.me');
      return;
    }

    const btn = document.getElementById('fetchBtn');
    btn.disabled = true;

    setStatus('loading', '<span class="spinner"></span> Analyse du lien en cours...');

    try {
      const quality = getQuality();
      const resp = await fetch('/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, quality })
      });

      const data = await resp.json();

      if (!resp.ok || data.error) {
        setStatus('error', `❌ ${data.error || 'Erreur inconnue'}`);
      } else {
        setStatus('success', `
          <div style="text-align:center">
            <div style="color:var(--success);font-size:0.8rem;margin-bottom:0.5rem">
              ✓ Vidéo prête — ${data.filename}
            </div>
            <a class="download-btn" href="/file/${data.filename}" download>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              Télécharger (${data.size})
            </a>
          </div>
        `);
      }
    } catch (e) {
      setStatus('error', '❌ Impossible de contacter le serveur');
    } finally {
      btn.disabled = false;
    }
  }

  // Allow Enter key
  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleFetch();
  });
</script>
</body>
</html>
